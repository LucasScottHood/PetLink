<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetLink - Cadastro</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
</head>
<body>
  <header><h1>PetLink</h1></header>

  <main>
    <form class="caixa" id="formCadastro" novalidate>
      <h2>Cadastre sua conta</h2>

      <label for="email">E-mail</label>
      <input id="email" type="email">

      <label for="senha">Senha</label>
      <input id="senha" type="password">

      <label for="confirmar">Confirmar senha</label>
      <input id="confirmar" type="password">

      <label class="opcao">
        <input id="veterinario" type="checkbox"> Sou veterinário
      </label>

      <!-- Só aparece se marcar "Sou veterinário" -->
      <div id="caixaVet" hidden>
        <label for="crmv">CRMV</label>
        <input id="crmv" placeholder="12345/RS">
      </div>

      <p class="erro" id="erro" role="alert"></p>
      <button class="botao" type="submit">Cadastrar</button>
      <p>Já tem conta? <a href="index.html">Entrar</a></p>
    </form>
  </main>

  <script src="js/dados.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
